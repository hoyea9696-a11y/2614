<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>AI Detector - Datasets</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css?v=3.1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=Outfit:wght@700;800&display=swap"
        rel="stylesheet">
    <style>
        .title-gradient {
            background: linear-gradient(135deg, #0f172a 20%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 2.2rem;
            letter-spacing: -1px;
        }

        body {
            background: transparent;
            padding: 0;
            margin: 0;
            overflow-x: hidden;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            padding: 24px;
        }

        .folder-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .folder-card:hover {
            transform: translateY(-5px);
            background: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .folder-card.active {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.05);
        }

        .folder-icon {
            color: #fbbf24;
            margin-bottom: 15px;
        }

        .menu-container {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 100;
        }

        .dots-btn {
            background: transparent;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dots-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 40px;
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            min-width: 160px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            z-index: 101;
            backdrop-filter: blur(10px);
        }

        .dropdown-menu.show {
            display: block;
            animation: menuFade 0.2s ease;
        }

        .menu-item {
            padding: 10px 16px;
            font-size: 0.85rem;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
            cursor: pointer;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .menu-item.danger {
            color: #ef4444;
        }

        .menu-item.danger:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        @keyframes menuFade {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .progress-bg {
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #10b981;
            transition: width 1s ease;
        }

        #modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div
        style="display: flex; justify-content: space-between; align-items: center; padding: 24px 24px 0 24px; margin-bottom: 1rem;">
        <h2 class="title-gradient" style="margin: 0;">資料集管理中心</h2>
        <button class="btn primary-btn"
            style="padding: 8px 20px; font-size: 0.85rem; display: flex; align-items: center; gap: 8px;"
            onclick="openModal()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            新增資料集
        </button>
    </div>

    <div id="dataset-grid" class="grid-container"></div>

    <!-- Modal -->
    <div id="modal-overlay" onclick="if(event.target==this) closeModal()">
        <div class="card" style="width: 450px; padding: 30px;" onclick="event.stopPropagation()">
            <h3 style="margin-top:0; color:#1e293b;">選取資料夾匯入</h3>
            <div style="margin-bottom: 1.5rem;">
                <label style="display:block; margin-bottom:8px; color:#64748b; font-size: 0.8rem;">資料集自訂名稱</label>
                <input type="text" id="ds-name" class="tech-input" placeholder="例如: 產品檢測_01" style="width:100%;">
            </div>
            <div style="margin-bottom: 2rem;">
                <label style="display:block; margin-bottom:10px; color:#64748b; font-size: 0.8rem;">資料集實體路徑
                    (透過選取器)</label>
                <button class="btn secondary-btn" style="width:100%; height: 50px; font-weight: 600;"
                    onclick="document.getElementById('folder-input').click()">
                    📁 點擊選取本地資料夾...
                </button>
                <input type="file" id="folder-input" webkitdirectory directory style="display:none;"
                    onchange="handleFolderSelect(this)">
                <div id="selected-path-hint"
                    style="margin-top: 10px; font-size: 0.7rem; color: #64748b; font-family: monospace; word-break: break-all; white-space: pre-line;">
                </div>
            </div>
            <div style="display: flex; gap: 12px; justify-content: flex-end;">
                <button class="btn secondary-btn" onclick="closeModal()">取消</button>
                <button id="confirm-btn" class="btn primary-btn" onclick="confirmAdd()" disabled>確認匯入</button>
            </div>
        </div>
    </div>

    <script>
        let datasets = JSON.parse(localStorage.getItem('ai_detector_datasets') || '[]');
        let activeDsId = localStorage.getItem('ai_detector_active_ds_id');
        let tempFiles = null;

        function closeAllMenus() { document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show')); }
        function openModal() { document.getElementById('modal-overlay').style.display = 'flex'; }
        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
            document.getElementById('selected-path-hint').innerText = '';
            document.getElementById('ds-name').value = '';
            document.getElementById('confirm-btn').disabled = true;
            document.getElementById('folder-input').value = '';
        }

        function handleFolderSelect(input) {
            const files = Array.from(input.files);
            const images = files.filter(f => /\.(jpg|jpeg|png|bmp|webp)$/i.test(f.name));
            const imgNames = new Set(images.map(f => f.name.substring(0, f.name.lastIndexOf('.'))));

            const validLabels = files.filter(f => {
                const ln = f.name.toLowerCase();
                if (ln === 'classes.txt' || ln === 'data.yaml' || ln === 'obj.names') return true;
                const name = f.name.substring(0, f.name.lastIndexOf('.'));
                return f.name.endsWith('.txt') && imgNames.has(name) && ln !== 'notes.txt';
            });

            const pathHint = files[0].webkitRelativePath.split('/')[0];
            document.getElementById('selected-path-hint').innerText = `偵測到: ${images.length} 張圖片, ${validLabels.length} 個匹配標記/配置\n路徑: ${pathHint}`;
            tempFiles = { imgCount: images.length, labelCount: validLabels.length, path: pathHint, validLabels, images };
            document.getElementById('confirm-btn').disabled = false;
        }

        async function confirmAdd() {
            const name = document.getElementById('ds-name').value.trim();
            if (!name || !tempFiles) return alert("請輸入名稱並選取資料夾");

            const btn = document.getElementById('confirm-btn');
            const originalText = btn.innerText;
            btn.disabled = true;

            const allFiles = [...tempFiles.images, ...tempFiles.validLabels];
            const total = allFiles.length;

            try {
                for (let i = 0; i < total; i++) {
                    const f = allFiles[i];
                    const formData = new FormData();
                    formData.append('name', name);

                    let path = f.name;
                    if (f.webkitRelativePath) {
                        const parts = f.webkitRelativePath.split('/');
                        if (parts.length > 1) {
                            path = parts.slice(1).join('/');
                        }
                    }
                    formData.append('file', f, path);
                    btn.innerText = `V2-TANK-MODE (${i + 1}/${total})...`;

                    const res = await fetch('/api/datasets/upload_v2', { method: 'POST', body: formData });
                    if (!res.ok) {
                        const errorText = await res.text();
                        throw new Error(`檔案上傳失敗 (${f.name}): ${res.status} ${errorText}`);
                    }
                    const result = await res.json();
                    if (result.status !== 'success') throw new Error(`伺服器報錯: ${result.message}`);
                }
                const newDs = { id: Date.now().toString(), name: name, path: tempFiles.path, imgCount: tempFiles.imgCount, labelCount: tempFiles.labelCount };
                datasets.push(newDs);
                saveDatasets();
                render();
                closeModal();
                selectDataset(newDs.id);
            } catch (e) {
                console.error("Upload Error:", e);
                alert("上傳失敗: " + e.message);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        function toggleMenu(e, id) {
            e.stopPropagation();
            const isOpen = document.getElementById('menu-' + id).classList.contains('show');
            closeAllMenus();
            if (!isOpen) document.getElementById('menu-' + id).classList.add('show');
        }

        async function deleteDataset(event, id, name) {
            event.stopPropagation();
            if (!confirm(`確定要徹底刪除資料集 "${name}" 嗎？\n這將移除電腦硬碟中的所有圖片與標記！`)) return;
            try {
                const res = await fetch(`http://127.0.0.1:8000/api/datasets/${encodeURIComponent(name)}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.status === 'success') {
                    datasets = datasets.filter(d => d.id !== id);
                    if (activeDsId === id) { activeDsId = null; localStorage.removeItem('ai_detector_active_ds_id'); localStorage.removeItem('ai_detector_active_ds'); }
                    saveDatasets();
                    render();
                } else { alert("刪除失敗: " + data.message); }
            } catch (e) { alert("刪除請求失敗"); }
        }

        function selectDataset(id) {
            activeDsId = id;
            localStorage.setItem('ai_detector_active_ds_id', id);
            const ds = datasets.find(d => d.id === id);
            if (ds) { localStorage.setItem('ai_detector_active_ds', JSON.stringify(ds)); window.parent.postMessage({ type: 'DATASET_SELECTED', dataset: ds }, '*'); }
            render();
            window.parent.postMessage({ type: 'SWITCH_PAGE', pageId: 'labeling' }, '*');
        }

        function saveDatasets() { localStorage.setItem('ai_detector_datasets', JSON.stringify(datasets)); }

        function render() {
            const grid = document.getElementById('dataset-grid'); grid.innerHTML = '';
            datasets.forEach(ds => {
                const isActive = ds.id === activeDsId;
                const percent = ds.imgCount > 0 ? Math.min(100, Math.round(ds.labelCount / ds.imgCount * 100)) : 0;
                const card = document.createElement('div');
                card.className = `folder-card ${isActive ? 'active' : ''}`;
                card.onclick = () => selectDataset(ds.id);
                card.innerHTML = `
                    <div class="menu-container">
                        <button class="dots-btn" onclick="toggleMenu(event, '${ds.id}')">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
                        </button>
                        <div id="menu-${ds.id}" class="dropdown-menu">
                            <div class="menu-item" onclick="analyzeHealth(event, '${ds.name}')">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                                診斷資料集
                            </div>
                            <div class="menu-item danger" onclick="deleteDataset(event, '${ds.id}', '${ds.name}')">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                                刪除資料集
                            </div>
                        </div>
                    </div>
                    <div class="folder-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
                    </div>
                    <div style="font-weight: 800; font-size: 1.2rem; color: #1e293b; margin-bottom: 4px; padding-right: 30px;">${ds.name}</div>
                    <div style="font-size: 0.7rem; color: #64748b; font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${ds.path}</div>
                    <div style="display: flex; justify-content: space-between; font-size: 0.75rem; margin-top: 20px; color: #64748b; font-weight: 600;">
                        <span>${ds.imgCount} 圖片</span>
                        <span style="color: ${percent === 100 ? '#10b981' : '#64748b'}">${percent}% 已標記</span>
                    </div>
                    <div class="progress-bg"><div class="progress-fill" style="width: ${percent}%; background: ${percent === 100 ? '#10b981' : '#3b82f6'};"></div></div>
                `;
                grid.appendChild(card);
            });
        }
        async function loadDatasetsFromServer(retryCount = 0) {
            try {
                const res = await fetch('http://127.0.0.1:8000/api/datasets/list', { cache: 'no-store' });
                const data = await res.json();
                if (data.status === 'success') { datasets = data.datasets; saveDatasets(); render(); }
            } catch (e) {
                if (retryCount < 1) setTimeout(() => loadDatasetsFromServer(retryCount + 1), 1500);
            }
        }
        render();
        loadDatasetsFromServer();
        window.onclick = () => closeAllMenus();

        window.addEventListener('message', (event) => {
            if (event.data.type === 'REFRESH_DATASETS' || event.data.type === 'REFRESH_DATA') loadDatasetsFromServer();
        });

        // 健康診斷邏輯
        let healthChart = null;
        async function analyzeHealth(event, name) {
            if (event) event.stopPropagation();
            closeAllMenus();
            const modal = document.getElementById('health-modal');
            const scoreVal = document.getElementById('health-score-val');
            const infoText = document.getElementById('health-info-text');
            modal.style.display = 'flex';
            scoreVal.innerText = '--';
            infoText.innerText = `正在診斷 ${name}...`;
            try {
                const res = await fetch(`http://127.0.0.1:8000/api/datasets/health?name=${encodeURIComponent(name)}`);
                const data = await res.json();
                if (data.status === 'success') {
                    scoreVal.innerText = data.score;
                    infoText.innerText = `圖片: ${data.total_images} | 已標記: ${data.labeled_images} (${data.coverage}%) | 平衡度: ${data.balance}%`;
                    renderHealthChart(data.class_distribution);
                } else { alert("診斷失敗: " + data.message); closeHealthModal(); }
            } catch (e) { alert("無法連接伺服器"); closeHealthModal(); }
        }
        function renderHealthChart(dist) {
            const ctx = document.getElementById('healthChart').getContext('2d');
            const labels = [], counts = [], colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4'];
            const total = Object.values(dist).reduce((s, v) => s + v.count, 0);
            Object.values(dist).forEach((item, i) => { labels.push(item.name); counts.push(item.count); });
            if (healthChart) healthChart.destroy();
            healthChart = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: labels, datasets: [{ data: counts, backgroundColor: labels.map((_, i) => colors[i % colors.length]), borderWidth: 0 }] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { color: '#94a3b8', font: { size: 10 } } },
                        tooltip: {
                            callbacks: {
                                label: (ctx) => {
                                    const pct = total > 0 ? ((ctx.parsed / total) * 100).toFixed(1) : 0;
                                    return ` ${ctx.label}: ${ctx.parsed} 張 (${pct}%)`;
                                }
                            }
                        },
                        // 顯示圖表內的百分比文字 (使用自訂外掛)
                        datalabels: false
                    }
                },
                plugins: [{
                    id: 'percentLabel',
                    afterDatasetsDraw(chart) {
                        const { ctx: c, data } = chart;
                        const ds = data.datasets[0];
                        const meta = chart.getDatasetMeta(0);
                        const tot = ds.data.reduce((a, b) => a + b, 0);
                        if (tot === 0) return;
                        c.save();
                        c.font = 'bold 11px Inter, sans-serif';
                        c.textAlign = 'center';
                        c.textBaseline = 'middle';
                        meta.data.forEach((arc, i) => {
                            const pct = ((ds.data[i] / tot) * 100);
                            if (pct < 5) return; // 太小的切片不顯示文字
                            const mid = (arc.startAngle + arc.endAngle) / 2;
                            const r = (arc.innerRadius + arc.outerRadius) / 2;
                            const x = arc.x + r * Math.cos(mid);
                            const y = arc.y + r * Math.sin(mid);
                            c.fillStyle = '#fff';
                            c.fillText(pct.toFixed(1) + '%', x, y);
                        });
                        c.restore();
                    }
                }]
            });
        }
        function toggleFormula() {
            const panel = document.getElementById('formula-panel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }
        function closeHealthModal() { document.getElementById('health-modal').style.display = 'none'; }
    </script>

    <!-- 健康診斷 Modal -->
    <div id="health-modal"
        style="display:none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; justify-content:center; align-items:center;">
        <div class="card"
            style="width: 400px; max-width: 90%; background: #0f172a; border: 1px solid #1e293b; padding: 24px; position: relative;">
            <button onclick="closeHealthModal()"
                style="position:absolute; top:15px; right:15px; background:none; border:none; color:#64748b; cursor:pointer; font-size:20px;">&times;</button>
            <h3 style="margin-top:0; color:#fff; display:flex; align-items:center; gap:8px;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.5">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
                </svg>

            </h3>
            <div style="text-align:center; margin: 20px 0;">
                <div style="font-size: 0.8rem; color: #64748b; margin-bottom: 5px;">健康分數</div>
                <div id="health-score-val"
                    style="font-size: 3rem; font-weight: 800; color: #3b82f6; font-family: 'Outfit';">--</div>
            </div>
            <div style="height: 200px; position: relative; margin-bottom: 20px;">
                <canvas id="healthChart"></canvas>
            </div>
            <div id="health-info-text"
                style="font-size: 0.8rem; color: #94a3b8; text-align:center; background:rgba(255,255,255,0.05); padding:10px; border-radius:8px;">
                正在載入分析數據...
            </div>
            <button onclick="toggleFormula()" style="width:100%; margin-top:16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #94a3b8; padding: 8px; border-radius: 8px; cursor: pointer; font-size: 0.8rem;">查看計算公式</button>
            <div id="formula-panel" style="display:none; margin-top:12px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:8px; padding:12px; font-size:0.75rem; color:#94a3b8; line-height:1.8;">
                <div style="color:#3b82f6; font-weight:700; margin-bottom:6px;">健康分數 (Health Score)</div>
                <code style="color:#e2e8f0; display:block; background:rgba(0,0,0,0.3); padding:6px 10px; border-radius:6px; margin-bottom:10px;">
                    分數 = (標記覆蓋率 × 0.5) + (平衡度 × 0.5)
                </code>
                <div style="color:#10b981; font-weight:700; margin-bottom:6px;">標記覆蓋率 (Coverage)</div>
                <code style="color:#e2e8f0; display:block; background:rgba(0,0,0,0.3); padding:6px 10px; border-radius:6px; margin-bottom:10px;">
                    覆蓋率 = 已標記圖片數 / 總圖片數 × 100
                </code>
                <div style="color:#f59e0b; font-weight:700; margin-bottom:6px;">類別平衡度 (Balance)</div>
                <code style="color:#e2e8f0; display:block; background:rgba(0,0,0,0.3); padding:6px 10px; border-radius:6px;">
                    平衡度 = (1 - 標準差 / 平均值) × 100<br>
                    ※ 各類別數量越均等，分數越高
                </code>
            </div>
            <button class="btn primary-btn" style="width:100%; margin-top:12px;"
                onclick="closeHealthModal()">完成</button>
        </div>
    </div>
</body>

</html>
