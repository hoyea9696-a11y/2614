<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>AI 訓練診斷中心</title>
    <link rel="stylesheet" href="style.css?v=3.5">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@600;900&display=swap" rel="stylesheet">
    <style>
        body { background: transparent; padding: 24px; color: #1e293b; }
        .diagnose-card { background: #fff; border-radius: 16px; padding: 30px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 24px 0; }
        .metric-box { background: #f8fafc; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid #f1f5f9; }
        .metric-label { font-size: 0.75rem; color: #64748b; margin-bottom: 8px; font-weight: 600; }
        .metric-value { font-size: 1.5rem; font-weight: 800; color: #3b82f6; }
        .ai-content { background: #1e293b; color: #f1f5f9; padding: 24px; border-radius: 12px; line-height: 1.6; font-size: 0.95rem; white-space: pre-wrap; }
        .loading { display: none; margin-top: 20px; color: #3b82f6; font-weight: 600; }
    </style>
</head>
<body>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h2 class="title-gradient" style="margin: 0; font-size: 2.2rem;">AI 訓練診斷中心</h2>
        <button class="btn primary-btn" onclick="runDiagnosis()" id="run-btn">開始 AI 深度診斷</button>
    </div>

    <div class="diagnose-card">
        <div id="no-data-hint" style="text-align: center; padding: 40px; color: #94a3b8;">
            點擊上方按鈕，讓 AI 分析您最近一次的訓練成果。
        </div>

        <div id="results-area" style="display: none;">
            <h3 style="margin-top: 0;">📊 訓練數據摘要</h3>
            <div class="metrics-grid">
                <div class="metric-box">
                    <div class="metric-label">最終 mAP50</div>
                    <div class="metric-value" id="res-map">-</div>
                </div>
                <div class="metric-box">
                    <div class="metric-label">訓練輪次</div>
                    <div class="metric-value" id="res-epochs">-</div>
                </div>
                <div class="metric-box">
                    <div class="metric-label">最終損失 (Loss)</div>
                    <div class="metric-value" id="res-loss">-</div>
                </div>
            </div>

            <h3 style="margin-top: 40px;">🤖 AI 專家診斷建議</h3>
            <div id="ai-report" class="ai-content">
                正在生成分析報告...
            </div>
        </div>
        
        <div id="loader" class="loading">
            AI 正在閱讀您的 results.csv 並思考優化方案...
        </div>
    </div>

    <script>
        async function runDiagnosis() {
            const btn = document.getElementById('run-btn');
            const loader = document.getElementById('loader');
            const resultsArea = document.getElementById('results-area');
            const hint = document.getElementById('no-data-hint');

            btn.disabled = true;
            btn.innerText = "分析中...";
            loader.style.display = 'block';
            hint.style.display = 'none';
            resultsArea.style.display = 'none';

            try {
                const res = await fetch('/api/optimization/diagnose');
                const data = await res.json();

                if (data.status === 'success') {
                    document.getElementById('res-map').innerText = (data.metrics_summary.final_map50 * 100).toFixed(2) + '%';
                    document.getElementById('res-epochs').innerText = data.metrics_summary.total_epochs;
                    document.getElementById('res-loss').innerText = data.metrics_summary.final_loss;
                    document.getElementById('ai-report').innerText = data.ai_diagnosis;
                    
                    resultsArea.style.display = 'block';
                } else {
                    alert("診斷失敗: " + data.message);
                    hint.style.display = 'block';
                }
            } catch (e) {
                alert("連線後端失敗");
            } finally {
                btn.disabled = false;
                btn.innerText = "開始 AI 深度診斷";
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
